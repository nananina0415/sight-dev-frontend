name: Mirror upstream feature

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overwrite main
        run: |
          git fetch https://github.com/khu-khlug/sight-frontend.git feat/group-page
          git push --force origin FETCH_HEAD:refs/heads/main
