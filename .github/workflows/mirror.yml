name: Mirror upstream feature

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 저장소 정책이 외부 액션을 허용하지 않으므로 git 명령만 사용한다.
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Overwrite main
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q mirror && cd mirror
          git fetch -q https://github.com/khu-khlug/sight-frontend.git feat/group-page
          git push --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" FETCH_HEAD:refs/heads/main
